<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#1976D2">
<title>Registro de acceso · ACQUA</title>
<style>
  :root {
    --brand: #1976D2; --brand-dark: #0F4C8F; --brand-50: #E8F1FB; --brand-100: #CFE2F7;
    --bg: #F2F5F9; --card: #fff; --field: #F8FAFC; --text: #17202C; --muted: #5E6B7B; --line: #D8E0EA;
    --in: #2E7D32; --in-ring: #A5D6A7; --out: #D84315; --out-ring: #FFAB91;
    --warn: #B26A00; --warn-bg: #FFF6E0; --err: #C62828; --err-bg: #FDECEA; --ok: #2E7D32;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
         background: var(--bg); color: var(--text); }
  .hidden { display: none !important; }

  /* ---------- Encabezado ---------- */
  .top { background: linear-gradient(160deg, var(--brand) 0%, var(--brand-dark) 100%); color: #fff;
         padding: calc(18px + env(safe-area-inset-top)) 16px 64px; }
  .top-in { max-width: 480px; margin: 0 auto; }
  .logo { height: 30px; width: auto; display: block; }
  .eyebrow { margin-top: 22px; font-size: 12px; font-weight: 600; letter-spacing: .08em;
             text-transform: uppercase; opacity: .8; }
  h1 { font-size: 26px; line-height: 1.15; margin: 4px 0 0; font-weight: 750; }

  /* ---------- Tarjeta ---------- */
  .wrap { max-width: 480px; margin: -44px auto 0; padding: 0 12px 32px; }
  .card { background: var(--card); border-radius: 18px; padding: 20px 18px;
          box-shadow: 0 1px 2px rgba(16,24,40,.06), 0 8px 24px rgba(16,24,40,.08); }
  .sec { display: flex; justify-content: space-between; align-items: baseline;
         font-size: 12px; font-weight: 700; letter-spacing: .07em; text-transform: uppercase; color: var(--brand); }
  .sec span { font-size: 13px; font-weight: 500; letter-spacing: 0; text-transform: none; color: var(--muted); }
  .sec + .field { margin-top: 12px; }
  .sep { height: 1px; background: var(--line); margin: 22px 0 18px; }

  /* ---------- Subestación (detectada por GPS) ---------- */
  .place { margin-top: 10px; border: 1.5px solid var(--brand-100); background: var(--brand-50);
           border-radius: 14px; padding: 14px; }
  .place.warn { background: var(--warn-bg); border-color: #FFE0A3; }
  .place.err { background: var(--err-bg); border-color: #F5C2C0; }
  .place .row { display: flex; gap: 10px; align-items: center; }
  .place .name { font-size: 19px; font-weight: 750; }
  .place .sub { font-size: 13px; color: var(--muted); margin-top: 3px; }
  .place .txt { font-size: 14px; line-height: 1.45; }
  .place .txt b { display: block; font-size: 15px; margin-bottom: 2px; }
  .place.warn .txt b { color: var(--warn); } .place.err .txt b { color: var(--err); }
  .pin { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; flex: none;
         background: var(--ok); color: #fff; font-size: 18px; }
  .pin.far { background: var(--warn); }
  .spin { width: 22px; height: 22px; border: 3px solid var(--brand-100); border-top-color: var(--brand);
          border-radius: 50%; animation: girar .8s linear infinite; flex: none; }
  @keyframes girar { to { transform: rotate(360deg); } }
  .linkbtn { background: none; border: 0; padding: 6px 0 0; color: var(--brand); font-size: 14px;
             font-weight: 700; cursor: pointer; }
  .place .row .linkbtn { margin-left: auto; padding: 6px 2px; }
  .opts { margin-top: 10px; display: grid; gap: 8px; }
  .opt { display: flex; justify-content: space-between; align-items: center; gap: 10px; width: 100%;
         padding: 14px; border: 1.5px solid var(--line); border-radius: 12px; background: #fff;
         color: var(--text); font-size: 16px; font-weight: 650; text-align: left; cursor: pointer; }
  .opt small { font-size: 13px; font-weight: 500; color: var(--muted); white-space: nowrap; }
  .opt.near small { color: var(--ok); font-weight: 700; }
  .opt:active { background: var(--brand-50); border-color: var(--brand); }
  .retry-sm { margin-top: 12px; padding: 11px 16px; border: 0; border-radius: 10px; background: var(--brand);
              color: #fff; font-size: 15px; font-weight: 700; cursor: pointer; }

  /* ---------- Campos ---------- */
  .field { margin-top: 14px; }
  label { display: block; font-size: 14px; font-weight: 600; margin-bottom: 6px; }
  .opt-l { font-weight: 400; color: var(--muted); }
  input { width: 100%; font-size: 17px; padding: 13px 14px; border: 1.5px solid var(--line);
          border-radius: 12px; background: var(--field); color: var(--text); transition: border-color .15s, box-shadow .15s; }
  input::placeholder { color: #9AA6B4; }
  input:focus { outline: none; border-color: var(--brand); background: #fff; box-shadow: 0 0 0 4px var(--brand-100); }
  input.bad { border-color: var(--err); box-shadow: 0 0 0 4px #FDE2E2; }
  .up { text-transform: uppercase; }
  .hint { font-size: 13px; color: var(--err); margin-top: 5px; }
  .hint:empty { display: none; }

  /* ---------- Cuadrilla ---------- */
  .mem { border: 1.5px solid var(--line); border-radius: 14px; padding: 12px; margin-top: 10px;
         position: relative; background: #fff; }
  .mem .n { font-size: 12px; font-weight: 700; color: var(--muted); margin-bottom: 8px; }
  .mem input { font-size: 16px; padding: 11px 12px; }
  .mem input + input { margin-top: 8px; }
  .rm { position: absolute; top: 6px; right: 6px; width: 34px; height: 34px; border: 0; border-radius: 10px;
        background: none; color: var(--muted); font-size: 22px; line-height: 1; cursor: pointer; }
  .rm:active { background: var(--bg); }
  .add { width: 100%; margin-top: 10px; padding: 13px; border: 1.5px dashed var(--brand); border-radius: 12px;
         background: var(--brand-50); color: var(--brand); font-size: 15px; font-weight: 700; cursor: pointer; }

  /* ---------- Botones ENTRADA / SALIDA (fijos abajo) ---------- */
  .actions { position: sticky; bottom: 0; margin: 22px -18px -20px; padding: 12px 18px calc(14px + env(safe-area-inset-bottom));
             background: rgba(255,255,255,.96); border-top: 1px solid var(--line); border-radius: 0 0 18px 18px;
             backdrop-filter: blur(6px); }
  .act-hint { font-size: 13px; color: var(--muted); text-align: center; margin-bottom: 10px; }
  .act-hint:empty { display: none; }
  .act-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .act { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 14px 8px; border: 0;
         border-radius: 14px; color: #fff; font-size: 18px; font-weight: 800; letter-spacing: .03em; cursor: pointer;
         transition: transform .08s, box-shadow .15s; }
  .act svg { width: 26px; height: 26px; }
  .act:active { transform: scale(.98); }
  .act:disabled { opacity: .4; cursor: default; box-shadow: none !important; }
  .b-in { background: var(--in); } .b-out { background: var(--out); }
  .b-in.sug { box-shadow: 0 0 0 4px var(--in-ring); } .b-out.sug { box-shadow: 0 0 0 4px var(--out-ring); }
  .priv { font-size: 12px; color: var(--muted); line-height: 1.45; margin-top: 18px; }

  /* ---------- Mensajes ---------- */
  .msg { text-align: center; padding: 34px 20px 28px; }
  .ico { width: 76px; height: 76px; margin: 0 auto; border-radius: 50%; display: grid; place-items: center;
         font-size: 40px; font-weight: 800; color: #fff; }
  .ico.in { background: var(--in); } .ico.out { background: var(--brand); }
  .ico.err { background: var(--err); } .ico.warn { background: var(--warn); }
  .msg h2 { margin: 16px 0 6px; font-size: 23px; }
  .msg .det { margin: 0; color: var(--text); font-size: 16px; font-weight: 600; }
  .msg .txt { margin: 10px 0 0; color: var(--muted); font-size: 15px; line-height: 1.45; }
  .msg .note { margin: 14px 0 0; padding: 10px 12px; border-radius: 10px; background: var(--warn-bg);
               color: var(--warn); font-size: 14px; }
  .msg .note:empty, .msg .txt:empty, .msg .det:empty { display: none; }
  .retry { margin-top: 20px; width: 100%; padding: 14px; border: 0; border-radius: 12px;
           background: var(--brand); color: #fff; font-size: 16px; font-weight: 700; cursor: pointer; }
  .foot { text-align: center; font-size: 12px; color: #8A96A5; margin-top: 18px; }
</style>
</head>

const S_FIJA = params.get('s');     // solo en links antiguos: subestación fija
let pos = null, posHora = 0;        // última ubicación GPS
let recintos = null;                // subestaciones ordenadas por distancia (desde el servidor)
let elegido = null;                 // subestación seleccionada
let verTodas = false, enviando = false;

/* Recordar datos en este teléfono para no reescribirlos cada vez */
const store = {
  get(k) { try { return localStorage.getItem('ra_' + k) || ''; } catch (e) { return ''; } },
  set(k, v) { try { localStorage.setItem('ra_' + k, v); } catch (e) {} }
};

function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text;
  return e;
}
function show(card) {
  $('formCard').classList.toggle('hidden', card !== 'form');
  $('msgCard').classList.toggle('hidden', card !== 'msg');
}
/* kind: in | out | err | warn  ·  retry: botón "Reintentar" (solo en errores de envío) */
function message(kind, title, det, text, note, retry) {
  const ico = $('msgIcon');
  ico.className = 'ico ' + kind;
  ico.textContent = kind === 'in' || kind === 'out' ? '✓' : '!';
  $('msgTitle').textContent = title; $('msgDet').textContent = det || '';
  $('msgText').textContent = text || ''; $('msgNote').textContent = note || '';
  $('btnRetry').classList.toggle('hidden', !retry);
  show('msg');
  window.scrollTo(0, 0);
}
function fmtDist(m) { return m < 1000 ? m + ' m' : (m / 1000).toFixed(1).replace('.', ',') + ' km'; }

/* ----- Subestación: detección por GPS + elección manual ----- */
function renderPlace(estado, info) {
  const box = $('place');
  box.replaceChildren();
  box.className = 'place';

  if (estado === 'buscando') {
    const row = el('div', 'row');
    row.append(el('div', 'spin'), el('div', 'txt', 'Buscando tu ubicación…'));
    box.append(row);
  } else if (estado === 'sinGPS' || estado === 'error') {
    box.classList.add('err');
    const t = el('div', 'txt');
    if (estado === 'sinGPS') {
      t.append(el('b', '', 'Activa la ubicación para registrar'));
      t.append(document.createTextNode(info || 'Necesitamos tu ubicación para saber en qué subestación estás.'));
      t.append(el('div', 'sub', 'iPhone: Ajustes → Privacidad y seguridad → Localización → Sitios web de Safari → "Mientras se usa". ' +
                                'Android: toca el candado junto a la dirección → Permisos → Ubicación.'));
    } else {
      t.append(el('b', '', 'No se pudieron cargar las subestaciones'));
      t.append(document.createTextNode(info || 'Revisa tu conexión a internet.'));
    }
    const b = el('button', 'retry-sm', 'Reintentar');
    b.type = 'button'; b.onclick = pedirUbicacion;
    box.append(t, b);
  } else if (elegido && !verTodas) {
    // Subestación seleccionada
    if (!elegido.enRango) box.classList.add('warn');
    const row = el('div', 'row');
    const pin = el('div', 'pin' + (elegido.enRango ? '' : ' far'), elegido.enRango ? '✓' : '!');
    const info2 = el('div');
    info2.append(el('div', 'name', elegido.nombre),
                 el('div', 'sub', elegido.enRango ? 'Estás aquí · detectada por GPS (a ' + fmtDist(elegido.distancia) + ')'
                                                  : 'Estás a ' + fmtDist(elegido.distancia) + ': quedará marcado fuera de rango'));
    row.append(pin, info2);
    if (!S_FIJA && recintos && recintos.length > 1) {
      const c = el('button', 'linkbtn', 'Cambiar');
      c.type = 'button'; c.onclick = () => { verTodas = true; renderPlace('ok'); };
      row.append(c);
    }
    box.append(row);
  } else {
    // Hay que elegir
    const cerca = recintos.filter(r => r.enRango);
    const lista = verTodas || cerca.length === 0 ? recintos : cerca;
    const t = el('div', 'txt');
    if (verTodas) t.append(el('b', '', '¿En qué subestación estás?'));
    else if (cerca.length > 1) t.append(el('b', '', 'Estás cerca de varias subestaciones'), document.createTextNode('Toca en la que estás:'));
    else {
      box.classList.add('warn');
      t.append(el('b', '', 'No detectamos una subestación cerca'),
               document.createTextNode('Elige dónde estás. El registro quedará marcado para revisión.'));
    }
    const opts = el('div', 'opts');
    lista.forEach(r => {
      const b = el('button', 'opt' + (r.enRango ? ' near' : ''));
      b.type = 'button';
      b.append(el('span', '', r.nombre), el('small', '', r.enRango ? 'Aquí · ' + fmtDist(r.distancia) : fmtDist(r.distancia)));
      b.onclick = () => elegir(r);
      opts.append(b);
    });
    box.append(t, opts);
    if (!verTodas && cerca.length > 1 && recintos.length > cerca.length) {
      const v = el('button', 'linkbtn', 'Ver todas las subestaciones');
      v.type = 'button'; v.onclick = () => { verTodas = true; renderPlace('ok'); };
      box.append(v);
    }
  }
  actualizarBotones();
}

function elegir(r) {
  elegido = r; verTodas = false;
  $('siteName').textContent = r ? r.nombre : 'Subestaciones';
  ['btnIn', 'btnOut'].forEach(id => $(id).classList.remove('sug'));
  if (r) (store.get('ultimo_' + r.id) === 'ENTRADA' ? $('btnOut') : $('btnIn')).classList.add('sug');
  renderPlace('ok');
}

function actualizarBotones() {
  const listo = !!(elegido && pos) && !enviando;
  $('btnIn').disabled = $('btnOut').disabled = !listo;
  $('actHint').textContent = listo || enviando ? '' : !pos ? 'Esperando tu ubicación…' : 'Elige la subestación para registrar';
}

/* ----- Ubicación ----- */
function obtenerPosicion() {
  return new Promise((ok, mal) => {
    if (!navigator.geolocation) return mal({ code: 0 });
    navigator.geolocation.getCurrentPosition(ok, mal, { enableHighAccuracy: true, timeout: 15000, maximumAge: 30000 });
  });
}
async function pedirUbicacion() {
  renderPlace('buscando');
  try {
    const p = await obtenerPosicion();
    pos = p.coords; posHora = Date.now();
  } catch (err) {
    pos = null;
    renderPlace('sinGPS', err.code === 1 ? 'El permiso de ubicación está bloqueado en este navegador.'
                        : err.code === 0 ? 'Este navegador no entrega ubicación.'
                        : 'No se pudo obtener tu ubicación. Sal a un lugar más despejado e inténtalo de nuevo.');
    return;
  }
  await cargarCercanos();
}
async function cargarCercanos() {
  try {
    const q = new URLSearchParams({ action: 'cercanos', k: K, lat: pos.latitude, lng: pos.longitude, acc: Math.round(pos.accuracy) });
    if (S_FIJA) q.set('s', S_FIJA);
    const d = await (await fetch(API_URL + '?' + q)).json();
    if (!d.ok) {
      if (/link/i.test(d.error || '')) { $('siteName').textContent = 'Link no válido'; message('warn', 'Link no válido', '', d.error); return; }
      throw new Error(d.error);
    }
    recintos = d.recintos;
  } catch (e) {
    renderPlace('error', e.message && e.message !== 'Failed to fetch' ? e.message : '');
    return;
  }
  // Selección automática
  if (S_FIJA) return elegir(recintos.find(r => r.id === S_FIJA) || null);
  if (elegido) return elegir(recintos.find(r => r.id === elegido.id) || null);   // reintento: mantener la elección
  const cerca = recintos.filter(r => r.enRango);
  if (cerca.length === 1) return elegir(cerca[0]);
  elegido = null; renderPlace('ok');
}

/* ----- RUT ----- */
function rutValido(rut) {
  const s = rut.replace(/[^0-9kK]/g, '').toUpperCase();
  if (s.length < 7) return false;
  const cuerpo = s.slice(0, -1), dv = s.slice(-1);
  if (!/^\d{6,8}$/.test(cuerpo)) return false;
  let suma = 0, m = 2;
  for (let i = cuerpo.length - 1; i >= 0; i--) { suma += +cuerpo[i] * m; m = m === 7 ? 2 : m + 1; }
  const r = 11 - (suma % 11);
  return dv === (r === 11 ? '0' : r === 10 ? 'K' : String(r));
}
function formatearRut(v) {
  const s = v.replace(/[^0-9kK]/g, '').toUpperCase().slice(0, 9);
  if (s.length < 2) return s;
  return s.slice(0, -1).replace(/\B(?=(\d{3})+(?!\d))/g, '.') + '-' + s.slice(-1);
}
$('rut').addEventListener('input', e => {
  e.target.value = formatearRut(e.target.value);
  e.target.classList.remove('bad'); $('rutHint').textContent = '';
});
$('nombre').addEventListener('input', e => e.target.classList.remove('bad'));

/* ----- Cuadrilla ----- */
function addMember(rut, nombre) {
  const box = el('div', 'mem');
  box.innerHTML = '<div class="n"></div><button class="rm" type="button" aria-label="Quitar integrante">×</button>' +
    '<input class="m-rut" placeholder="RUT" maxlength="12" autocomplete="off">' +
    '<input class="m-nom up" placeholder="Nombre completo" maxlength="80" autocomplete="off">' +
    '<div class="hint"></div>';
  const r = box.querySelector('.m-rut'), n = box.querySelector('.m-nom');
  r.value = rut || ''; n.value = nombre || '';
  r.addEventListener('input', () => { r.value = formatearRut(r.value); r.classList.remove('bad'); box.querySelector('.hint').textContent = ''; });
  n.addEventListener('input', () => n.classList.remove('bad'));
  box.querySelector('.rm').onclick = () => { box.remove(); renumber(); };
  $('crew').appendChild(box);
  renumber();
  return box;
}
function renumber() {
  const items = [...$('crew').children];
  items.forEach((b, i) => b.querySelector('.n').textContent = 'Integrante ' + (i + 1));
  $('crewCount').textContent = items.length ? (items.length + 1) + ' personas en total' : 'Solo yo';
}
function leerCuadrilla() {
  // Devuelve la lista o null si hay errores (marca los campos)
  const out = []; let ok = true;
  [...$('crew').children].forEach(b => {
    const r = b.querySelector('.m-rut'), n = b.querySelector('.m-nom');
    if (!r.value.trim() && !n.value.trim()) return; // fila vacía: se ignora
    if (!rutValido(r.value)) { r.classList.add('bad'); b.querySelector('.hint').textContent = 'RUT inválido'; ok = false; }
    if (n.value.trim().length < 3) { n.classList.add('bad'); ok = false; }
    out.push({ rut: r.value.trim(), nombre: n.value.trim().toUpperCase() });
  });
  return ok ? out : null;
}
$('btnAdd').onclick = () => addMember().querySelector('.m-rut').focus();

/* ----- Envío ----- */
async function registrar(tipo) {
  if (!elegido || !pos) return;
  const rut = $('rut').value.trim(), nombre = $('nombre').value.trim();
  if (!rutValido(rut)) { $('rut').classList.add('bad'); $('rutHint').textContent = 'RUT inválido'; $('rut').focus(); return; }
  if (nombre.length < 3) { $('nombre').classList.add('bad'); $('nombre').focus(); return; }
  const integrantes = leerCuadrilla();
  if (!integrantes) { const bad = document.querySelector('#crew .bad'); if (bad) bad.focus(); return; }

  const empresa = $('empresa').value.trim().toUpperCase();
  store.set('rut', rut); store.set('nombre', nombre.toUpperCase()); store.set('empresa', empresa);
  store.set('cuadrilla', JSON.stringify(integrantes));

  enviando = true; actualizarBotones();
  const label = (tipo === 'ENTRADA' ? $('btnIn') : $('btnOut')).querySelector('span');
  const orig = label.textContent; label.textContent = 'Enviando…';

  try {
    // Si la página lleva rato abierta, se toma la ubicación de nuevo
    if (Date.now() - posHora > 2 * 60 * 1000) {
      label.textContent = 'Ubicando…';
      try { const p = await obtenerPosicion(); pos = p.coords; posHora = Date.now(); } catch (e) { /* se usa la última */ }
      label.textContent = 'Enviando…';
    }
    const body = {
      k: K, s: elegido.id, tipo, rut, nombre: nombre.toUpperCase(), integrantes,
      empresa, motivo: $('motivo').value.trim().toUpperCase(),
      lat: pos.latitude, lng: pos.longitude, acc: pos.accuracy,
      ua: navigator.userAgent
    };
    // text/plain evita el "preflight" CORS con Apps Script
    const r = await fetch(API_URL, { method: 'POST', body: JSON.stringify(body) });
    const d = await r.json();
    if (!d.ok) throw new Error(d.error || 'Error al registrar');
    store.set('ultimo_' + elegido.id, tipo);
    $('motivo').value = '';
    const nota = d.estado === 'FUERA DE RANGO' ? 'Tu ubicación aparece lejos de la subestación. El registro quedó marcado para revisión.' : '';
    const esEntrada = tipo === 'ENTRADA';
    message(esEntrada ? 'in' : 'out',
            (esEntrada ? 'Entrada' : 'Salida') + ' registrada',
            d.recinto + ' · ' + d.hora + ' hrs' + (d.personas > 1 ? ' · ' + d.personas + ' personas' : ''),
            esEntrada ? 'Ya puedes cerrar esta página. Al salir, vuelve a abrir el link y marca tu salida.'
                      : 'Ya puedes cerrar esta página. ¡Buen viaje!',
            nota, false);
  } catch (e) {
    message('err', 'No se pudo registrar', '',
            e.message === 'Failed to fetch' ? 'Revisa tu conexión a internet e inténtalo de nuevo.' : e.message, '', true);
  } finally {
    enviando = false; label.textContent = orig; actualizarBotones();
  }
}
$('btnIn').onclick = () => registrar('ENTRADA');
$('btnOut').onclick = () => registrar('SALIDA');
$('btnRetry').onclick = () => { show('form'); pedirUbicacion(); };

/* ----- Inicio ----- */
(function init() {
  if (!K) {
    message('warn', 'Abre el link de registro', '', 'Esta página debe abrirse desde el link de registro, la tarjeta NFC o el código QR.');
    return;
  }
  $('rut').value = store.get('rut'); $('nombre').value = store.get('nombre'); $('empresa').value = store.get('empresa');
  try { JSON.parse(store.get('cuadrilla') || '[]').forEach(m => addMember(m.rut, m.nombre)); } catch (e) {}
  show('form');
  pedirUbicacion();
})();
</script>
</body>
</html>
